<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goal and basics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F4F5F1; color: #14201E; font-family: 'Manrope', sans-serif; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; font-weight: 700; color: #5B6763; letter-spacing: 0.04em">STEP 1 OF 4</div>
    <div style="display: flex; gap: 6px">
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #0E5A52"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #D5DAD3"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #D5DAD3"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #D5DAD3"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800">What do you want to change?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.4; color: #5B6763">Pick one goal to start. We build everything around it.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <button type="button" style="text-align: left; font-family: inherit; color: inherit; background: #E1EFEC; border: 2px solid #0E5A52; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px; cursor: pointer">
      <span style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 17px; font-weight: 800">Build muscle</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E5A52" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
      </span>
      <span style="font-size: 14px; line-height: 1.4; color: #3C4A46">Find why your muscles are not growing and fix it.</span>
    </button>
    <button type="button" style="text-align: left; font-family: inherit; color: inherit; background: #fff; border: 1px solid #D5DAD3; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px; cursor: pointer">
      <span style="font-size: 17px; font-weight: 800">Lose fat</span>
      <span style="font-size: 14px; line-height: 1.4; color: #3C4A46">A deficit you can actually follow, with food and movement that fit your day.</span>
    </button>
    <div style="font-size: 13px; color: #5B6763; padding: 0 4px">Gain weight and body recomposition are coming later.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 13px; font-weight: 700; color: #5B6763">ABOUT YOU</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #5B6763">Age
        <input type="text" value="28" readonly style="font-family: inherit; font-size: 17px; font-weight: 700; color: #14201E; background: #fff; border: 1px solid #D5DAD3; border-radius: 12px; height: 48px; box-sizing: border-box; padding: 0 12px; width: 100%">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #5B6763">Height (cm)
        <input type="text" value="172" readonly style="font-family: inherit; font-size: 17px; font-weight: 700; color: #14201E; background: #fff; border: 1px solid #D5DAD3; border-radius: 12px; height: 48px; box-sizing: border-box; padding: 0 12px; width: 100%">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #5B6763">Weight (kg)
        <input type="text" value="70" readonly style="font-family: inherit; font-size: 17px; font-weight: 700; color: #14201E; background: #fff; border: 1px solid #D5DAD3; border-radius: 12px; height: 48px; box-sizing: border-box; padding: 0 12px; width: 100%">
      </label>
    </div>
    <div style="font-size: 13px; line-height: 1.4; color: #5B6763">Next: your routine, food habits and sleep. About 5 minutes.</div>
  </div>

  <div style="flex: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="font-family: inherit; font-size: 16px; font-weight: 800; color: #fff; background: #0E5A52; border: 0; border-radius: 14px; height: 54px; cursor: pointer">Continue</button>
    <div style="text-align: center; font-size: 12px; color: #5B6763">Sample data shown in this mockup</div>
  </div>
</div>
</x-dc>

</body>
</html>
