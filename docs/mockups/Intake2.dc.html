    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; font-weight: 700; color: #5B6763">MEALS A DAY</div>
    <div style="display: flex; gap: 8px">
      <button type="button" style="flex: 1; font-family: inherit; font-size: 14px; font-weight: 700; color: #3C4A46; background: #fff; border: 1px solid #D5DAD3; border-radius: 12px; height: 44px; cursor: pointer">2</button>

      <button type="button" style="flex: 1; font-family: inherit; font-size: 14px; font-weight: 700; color: #3C4A46; background: #fff; border: 1px solid #D5DAD3; border-radius: 12px; height: 44px; cursor: pointer">5+</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; font-weight: 700; color: #5B6763">EATING OUT OR ORDERING IN, PER WEEK</div>
