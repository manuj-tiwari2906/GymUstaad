<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intake: training history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F4F5F1; color: #14201E; font-family: 'Manrope', sans-serif; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; font-weight: 700; color: #5B6763; letter-spacing: 0.04em">STEP 4 OF 4</div>
    <div style="display: flex; gap: 6px">
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #0E5A52"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #0E5A52"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #0E5A52"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #0E5A52"></div>
    </div>
  </div>

  <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800">Your training so far</h1>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; font-weight: 700; color: #5B6763">HOW LONG HAVE YOU LIFTED</div>
    <div style="display: flex; gap: 8px">
      <button type="button" style="flex: 1; font-family: inherit; font-size: 13px; font-weight: 700; color: #3C4A46; background: #fff; border: 1px solid #D5DAD3; border-radius: 12px; height: 44px; cursor: pointer">Under 6 mo</button>
      <button type="button" style="flex: 1; font-family: inherit; font-size: 13px; font-weight: 800; color: #0B463F; background: #E1EFEC; border: 2px solid #0E5A52; border-radius: 12px; height: 44px; cursor: pointer">6 to 24 mo</button>
      <button type="button" style="flex: 1; font-family: inherit; font-size: 13px; font-weight: 700; color: #3C4A46; background: #fff; border: 1px solid #D5DAD3; border-radius: 12px; height: 44px; cursor: pointer">2+ years</button>
    </div>
  </div>

  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #5B6763">WHAT YOU DO NOW (A ROUGH LIST IS FINE)
    <textarea readonly rows="3" style="font-family: inherit; font-size: 15px; line-height: 1.4; color: #14201E; background: #fff; border: 1px solid #D5DAD3; border-radius: 12px; padding: 12px 14px; box-sizing: border-box; width: 100%; resize: none">Chest day Monday: flat bench 3×8, pec deck 3×12. Back, legs, shoulders on other days.</textarea>
  </label>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; font-weight: 700; color: #5B6763">WHICH PART FEELS BEHIND</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <span style="background: #E1EFEC; border: 2px solid #0E5A52; border-radius: 20px; padding: 7px 14px; font-size: 14px; font-weight: 800; color: #0B463F">Chest</span>
      <span style="background: #fff; border: 1px solid #D5DAD3; border-radius: 20px; padding: 7px 14px; font-size: 14px; font-weight: 600">Shoulders</span>
      <span style="background: #fff; border: 1px solid #D5DAD3; border-radius: 20px; padding: 7px 14px; font-size: 14px; font-weight: 600">Arms</span>
      <span style="background: #fff; border: 1px solid #D5DAD3; border-radius: 20px; padding: 7px 14px; font-size: 14px; font-weight: 600">Back</span>
      <span style="background: #fff; border: 1px solid #D5DAD3; border-radius: 20px; padding: 7px 14px; font-size: 14px; font-weight: 600">Legs</span>
      <span style="background: #fff; border: 1px solid #D5DAD3; border-radius: 20px; padding: 7px 14px; font-size: 14px; font-weight: 600">Not sure</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; font-weight: 700; color: #5B6763">ANY INJURY OR PAIN WE SHOULD WORK AROUND</div>
    <div style="display: flex; gap: 8px">
      <button type="button" style="flex: 1; font-family: inherit; font-size: 14px; font-weight: 800; color: #0B463F; background: #E1EFEC; border: 2px solid #0E5A52; border-radius: 12px; height: 44px; cursor: pointer">No</button>
      <button type="button" style="flex: 1; font-family: inherit; font-size: 14px; font-weight: 700; color: #3C4A46; background: #fff; border: 1px solid #D5DAD3; border-radius: 12px; height: 44px; cursor: pointer">Yes, tell us</button>
    </div>
  </div>

  <div style="flex: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="font-family: inherit; font-size: 16px; font-weight: 800; color: #fff; background: #0E5A52; border: 0; border-radius: 14px; height: 54px; cursor: pointer">Build my assessment</button>
    <div style="text-align: center; font-size: 12px; color: #5B6763">We use these answers with your logs and photos. Nothing is shared.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
